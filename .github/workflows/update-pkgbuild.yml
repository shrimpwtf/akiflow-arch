name: Update PKGBUILD

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8am UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Install dependencies
        working-directory: /
        run: pacman -Syu --noconfirm --needed git python python-yaml curl openssh sudo

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: git config --global --add safe.directory '*'

      - name: Check for new version
        id: check
        run: |
          python3 << 'PYEOF'
          import urllib.request, json, yaml, re, os, base64

          with urllib.request.urlopen('https://download.akiflow.com/builds/latest.yml') as r:
              data = yaml.safe_load(r.read().decode())

          new_version = data['version']
          path = data['path']
          sha512_b64 = data['sha512']
          sha512_hex = base64.b64decode(sha512_b64).hex()

          m = re.search(r'Akiflow-[\d.]+-([a-f0-9]+)-x64\.exe', path)
          build_hash = m.group(1) if m else ''

          # Compare against what the AUR actually serves, not this repo's PKGBUILD:
          # if a push to the AUR fails, the repo is already ahead and would
          # otherwise never be retried.
          rpc = 'https://aur.archlinux.org/rpc/v5/info?arg[]=akiflow-bin'
          with urllib.request.urlopen(rpc) as r:
              aur = json.load(r)
          if aur.get('type') == 'error':
              raise SystemExit(f"AUR RPC error: {aur.get('error')}")
          current_version = aur['results'][0]['Version'].rsplit('-', 1)[0] if aur['results'] else ''

          needs_update = new_version != current_version
          print(f"AUR: {current_version or 'none'}, Latest: {new_version}, Update needed: {needs_update}")

          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              f.write(f"new_version={new_version}\n")
              f.write(f"build_hash={build_hash}\n")
              f.write(f"sha512={sha512_hex}\n")
              f.write(f"needs_update={'true' if needs_update else 'false'}\n")
          PYEOF

      - name: Update PKGBUILD
        if: steps.check.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          BUILD_HASH: ${{ steps.check.outputs.build_hash }}
          SHA512: ${{ steps.check.outputs.sha512 }}
        run: |
          python3 << 'PYEOF'
          import re, os

          new_version = os.environ['NEW_VERSION']
          build_hash = os.environ['BUILD_HASH']
          sha512 = os.environ['SHA512']

          with open('PKGBUILD') as f:
              content = f.read()

          content = re.sub(r'^pkgver=.+$', f'pkgver={new_version}', content, flags=re.MULTILINE)
          content = re.sub(r'^pkgrel=.+$', 'pkgrel=1', content, flags=re.MULTILINE)
          content = re.sub(r'^_buildhash=.+$', f'_buildhash={build_hash}', content, flags=re.MULTILINE)
          content = re.sub(r"sha512sums=\('.*?'\)", f"sha512sums=('{sha512}')", content, flags=re.DOTALL)

          with open('PKGBUILD', 'w') as f:
              f.write(content)

          print(f"Updated PKGBUILD: {new_version} ({build_hash})")
          PYEOF

      - name: Generate .SRCINFO
        if: steps.check.outputs.needs_update == 'true'
        run: |
          useradd -m builder
          cp PKGBUILD /home/builder/PKGBUILD
          sudo -u builder bash -c 'cd ~ && makepkg --printsrcinfo' > .SRCINFO
          cat .SRCINFO

      - name: Commit and push to GitHub
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          # Already committed on a previous run whose AUR push failed: nothing to commit.
          if git diff --cached --quiet; then
            echo "PKGBUILD/.SRCINFO already up to date in the repo"
          else
            git commit -m "chore: update to v${{ steps.check.outputs.new_version }}"
            git push
          fi

      - name: Push to AUR
        if: steps.check.outputs.needs_update == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          # Container jobs set HOME=/github/home, but ssh reads /root/.ssh, so a
          # ~/.ssh/config is silently ignored ("Host key verification failed").
          # Pass everything explicitly instead of relying on $HOME.
          KEY="$RUNNER_TEMP/aur_key"
          printf '%s\n' "$AUR_SSH_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/aur_known_hosts -o StrictHostKeyChecking=accept-new"

          # AUR requires a flat repo — only PKGBUILD and .SRCINFO
          TMPDIR=$(mktemp -d)
          cp PKGBUILD .SRCINFO "$TMPDIR/"
          cd "$TMPDIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${{ steps.check.outputs.new_version }}"
          git push --force ssh://aur@aur.archlinux.org/akiflow-bin.git HEAD:master
